name: Build Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -o scrcpy-mobile-main.zip -x 'README*' || true
      - name: Fetch submodules
        run: |
          python3 - <<'PY'
          import configparser, subprocess, os, time
          def clean(path):
              subprocess.run(['rm','-rf',path])
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for s in c.sections():
              path = c[s]['path']; url = c[s]['url']
              if os.path.exists(path) and os.listdir(path):
                  print('skip', path, flush=True); continue
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              ok=False
              for attempt in range(8):
                  try:
                      print('cloning', url, '->', path, flush=True)
                      if path == 'external/adb-mobile':
                          subprocess.run(['git','clone','--depth','1',url,path], check=True)
                          # nested vendor submodules may hit googlesource 503; retry until done
                          for i in range(10):
                              r=subprocess.run(['git','submodule','update','--init','--recursive'], cwd=path, capture_output=True)
                              if r.returncode==0:
                                  print('adb-mobile submodules ok', flush=True); break
                              print('adb-mobile submodule retry', i+1, flush=True)
                              time.sleep(25)
                          else:
                              raise SystemExit('adb-mobile submodules failed')
                      else:
                          subprocess.run(['git','clone','--depth','1','--recurse-submodules',url,path], check=True, capture_output=True)
                      ok=True
                      break
                  except Exception as e:
                      print('retry', attempt+1, path, flush=True)
                      clean(path); time.sleep(20)
              if not ok:
                  raise SystemExit('clone failed: '+path)
          PY
      - name: Patch zstd for CMake compat
        run: |
          python3 - <<'PY'
          import re
          p='external/adb-mobile/external/zstd/build/cmake/programs/CMakeLists.txt'
          s=open(p).read()
          def fix(m):
              line=m.group(0)
              if 'BUNDLE DESTINATION' in line: return line
              return line[:-1]+' BUNDLE DESTINATION bin)' if line.endswith(')') else line
          s=re.sub(r'install\(TARGETS zstd[^)]*\)', fix, s)
          open(p,'w').write(s)
          for line in open(p):
              if 'install(TARGETS zstd' in line: print('PATCHED:',line.rstrip())
          PY
      - name: Patch adb to use built protobuf
        run: |
          python3 - <<'PY'
          p='external/adb-mobile/porting/scripts/make-adb.sh'
          s=open(p).read()
          old='-DANDROID_TOOLS_USE_BUNDLED_LIBUSB=ON \\'
          new=(old+'\n\t-DProtobuf_INCLUDE_DIR="$SOURCE_ROOT/external/protobuf/src" \\\n'
               '\t-DProtobuf_LIBRARY="$FULL_OUTPUT/libprotobuf.a" \\\n'
               '\t-DProtobuf_LITE_LIBRARY="$FULL_OUTPUT/libprotobuf-lite.a" \\\n'
               '\t-DProtobuf_PROTOC_EXECUTABLE="$HOME/protoc/bin/protoc" \\')
          if old in s and new not in s:
              s=s.replace(old,new)
              open(p,'w').write(s)
              print('ADB PATCHED OK')
          elif new in s:
              print('ADB ALREADY PATCHED')
          else:
              print('ADB PATCH FAIL: marker not found')
          # add absl (protobuf bundled) + brew include dirs so adb finds absl/gtest/etc
          b_old='CXX_INCLUDES = -I$BORINGSSL_DIR/include |g'
          b_new='CXX_INCLUDES = -I$BORINGSSL_DIR/include -I$SOURCE_ROOT/external/protobuf/third_party/abseil-cpp -I/opt/homebrew/include |g'
          if b_old in s and b_new not in s:
              s=s.replace(b_old,b_new)
              open(p,'w').write(s)
              print('ADB INCLUDE PATCHED OK')
          elif b_new in s:
              print('ADB INCLUDE ALREADY PATCHED')
          else:
              print('ADB INCLUDE PATCH FAIL: marker not found')
          PY
      - name: Install tools
        run: |
          brew install meson ninja cmake openjdk@17 lz4 brotli googletest nasm || true
          # adb-mobile requires exact protoc 28.3 -> download official binary
          if ! protoc --version 2>/dev/null | grep -q "28.3"; then
            echo "installing protoc 28.3..."
            if uname -m | grep -qi "arm"; then PROTOCZIP="protoc-28.3-osx-aarch_64.zip"; else PROTOCZIP="protoc-28.3-osx-x86_64.zip"; fi
            curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/$PROTOCZIP"
            mkdir -p "$HOME/protoc"
            unzip -o /tmp/protoc.zip -d "$HOME/protoc" >/dev/null
            ls -la "$HOME/protoc/bin/" || true
            echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/protoc/bin:$PATH"
          fi
          protoc --version
          # CMake 4.x breaks zstd 1.4.7 -> force CMake 3.x system-wide (override brew cmake symlink)
          if cmake --version 2>/dev/null | head -1 | grep -qE "cmake version 4\."; then
            echo "installing CMake 3.30.5 and overriding system cmake..."
            curl -sSL -o /tmp/cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-macos-universal.tar.gz"
            mkdir -p "$HOME/cmake"; tar -xzf /tmp/cmake.tar.gz -C "$HOME/cmake"
            CMAKEBIN=$(find "$HOME/cmake" -path "*/CMake.app/Contents/bin" -type d | head -1)
            echo "CMAKEBIN=$CMAKEBIN"
            brew unlink cmake 2>/dev/null || true
            ln -sf "$CMAKEBIN/cmake" /opt/homebrew/bin/cmake
            ln -sf "$CMAKEBIN/cmake" /usr/local/bin/cmake 2>/dev/null || true
            echo "$CMAKEBIN" >> "$GITHUB_PATH"; export PATH="$CMAKEBIN:$PATH"
          fi
          cmake --version | head -1
          echo "/opt/homebrew/opt/openjdk@17/bin:$PATH" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/openjdk@17/bin:$PATH"
          java -version
      - name: Build porting libs
        run: |
          which cmake; cmake --version | head -1
          # ffmpeg's make-ffmpeg.sh configure uses --as="gas-preprocessor.pl ..." but the
          # runner has no gas-preprocessor in PATH -> "GNU assembler not found". Install it.
          mkdir -p "$HOME/bin"
          curl -o "$HOME/bin/gas-preprocessor.pl" -sSL -m 60 https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl || true
          chmod +x "$HOME/bin/gas-preprocessor.pl" 2>/dev/null || true
          export PATH="$HOME/bin:$PATH"
          # CRITICAL: scrcpy-mobile-main.zip 解压出的 porting/ 默认只读(555)，导致 mkdir/cp 到 porting/libs 失败
          sudo chmod -R u+rwX porting 2>/dev/null || chmod -R u+rwX porting 2>/dev/null || true
          # CRITICAL: never create external/adb-mobile/libs — 'libs' is a plain (non-phony) make
          # target in adb-mobile's root Makefile; if that directory exists, make treats the
          # target as up-to-date and SKIPS compiling lz4/zstd/brotli/protobuf/adb -> no *.a.
          rm -rf external/adb-mobile/libs 2>/dev/null || true
          # root porting Makefile's adb-mobile target copies libadb-full.a into ./libs/...
          # relative to the porting/ dir (= porting/libs/...). Pre-create writable dirs.
          rm -rf libs porting/libs 2>/dev/null || true
          # adb-mobile target does 'cp adb_public.h -> ./libs/include' (relative to porting/);
          # if include doesn't exist the cp turns ./libs/include into a FILE, then libsdl's
          # make-libsdl.sh 'mkdir -p include' fails with 'File exists'. Pre-create include dir.
          mkdir -p porting/libs/include porting/libs/iphoneos/arm64 porting/libs/iphonesimulator/arm64 porting/libs/iphonesimulator/x86_64
          chmod -R u+rwX porting/libs
          # Build adb-mobile + libsdl + ffmpeg first. Each emits its pkg-config .pc:
          #  - make-libsdl.sh generates sdl3.pc into porting/libs/lib/pkgconfig (OS64 pass)
          #  - ffmpeg's `make install` emits .pc into its own build dir, NOT into the
          #    PKG_CONFIG_PATH dir that scrcpy-config/meson & make-scrcpy.sh/cmake expect,
          #    hence "Dependency libavformat/sdl3 not found". Copy ffmpeg's over.
          make -C porting adb-mobile libsdl ffmpeg
          mkdir -p porting/libs/lib/pkgconfig
          cp -v porting/build/ffmpeg/iphoneos-arm64/lib/pkgconfig/*.pc porting/libs/lib/pkgconfig/ 2>/dev/null || true
          ls porting/libs/lib/pkgconfig/ 2>/dev/null || true
          # make-scrcpy.sh compiles scrcpy per-arch via cmake and locates ffmpeg by
          # pkg-config; inherit this path so cmake finds the .pc too.
          export PKG_CONFIG_PATH="$PWD/porting/libs/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # scrcpy is built for 3 archs by make-scrcpy.sh's for-loop; simulator archs would
          # link the (arm64) ffmpeg .pc -> arch mismatch. User needs the real-device
          # (iphoneos/arm64) IPA only, so restrict the for-loop to iphoneos/arm64.
          # (edits the extracted build copy on the runner, not the repo source)
          sed -i '' 's/iphoneos\/arm64:OS64 iphonesimulator\/arm64:SIMULATORARM64 iphonesimulator\/x86_64:SIMULATOR64/iphoneos\/arm64:OS64/' porting/Makefile 2>/dev/null || \
          sed -i 's/iphoneos\/arm64:OS64 iphonesimulator\/arm64:SIMULATORARM64 iphonesimulator\/x86_64:SIMULATOR64/iphoneos\/arm64:OS64/' porting/Makefile 2>/dev/null || true
          grep -n "for target in" porting/Makefile
          make -C porting scrcpy
      - name: Build scrcpy-server
        run: make -C porting scrcpy-server
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p build/archive
          xcodebuild archive -project "scrcpy-app/Scrcpy Remote.xcodeproj" -scheme "Scrcpy Remote" -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/archive/ScrcpyRemote.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R "build/archive/ScrcpyRemote.xcarchive/Products/Applications/Scrcpy Remote.app" build/ipa/Payload/
          cd build/ipa
          zip -qr ../../ScrcpyRemote-unsigned.ipa Payload
          cd ../..
          ls -lh ScrcpyRemote-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 30
