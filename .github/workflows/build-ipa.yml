name: Build Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source (python handles unicode names)
        run: python3 -c "import zipfile; zipfile.ZipFile('scrcpy-mobile-main.zip').extractall()"
      - name: Init repo and submodules
        run: |
          git init -q
          git submodule sync --recursive || true
          git submodule update --init --recursive || git submodule update --init --recursive
      - name: Install tools
        run: |
          brew install meson ninja cmake openjdk@17 || true
          echo "/opt/homebrew/opt/openjdk@17/bin:$PATH" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/openjdk@17/bin:$PATH"
          java -version
      - name: Build porting libs
        run: make -C porting
      - name: Build scrcpy-server
        run: make -C porting scrcpy-server
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p build/archive
          xcodebuild archive -project "scrcpy-app/Scrcpy Remote.xcodeproj" -scheme "Scrcpy Remote" -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/archive/ScrcpyRemote.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R "build/archive/ScrcpyRemote.xcarchive/Products/Applications/Scrcpy Remote.app" build/ipa/Payload/
          cd build/ipa
          zip -qr ../../ScrcpyRemote-unsigned.ipa Payload
          cd ../..
          ls -lh ScrcpyRemote-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 30
