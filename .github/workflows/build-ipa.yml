name: Build Unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: unzip -o scrcpy-mobile-main.zip -x 'README*' || true
      - name: Fetch submodules
        run: |
          python3 - <<'PY'
          import configparser, subprocess, os
          c = configparser.ConfigParser()
          c.read('.gitmodules')
          for s in c.sections():
              path = c[s]['path']; url = c[s]['url']
              if os.path.exists(path):
                  print('skip', path, flush=True); continue
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              print('cloning', url, flush=True)
              subprocess.run(['git', 'clone', '--depth', '1', '--recurse-submodules', url, path], check=True)
          PY
      - name: Install tools
        run: |
          brew install meson ninja cmake openjdk@17 || true
          # adb-mobile requires exact protoc 28.3 -> download official binary
          if ! protoc --version 2>/dev/null | grep -q "28.3"; then
            echo "installing protoc 28.3..."
            if uname -m | grep -qi "arm"; then PROTOCZIP="protoc-28.3-osx-aarch_64.zip"; else PROTOCZIP="protoc-28.3-osx-x86_64.zip"; fi
            curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/$PROTOCZIP"
            mkdir -p "$HOME/protoc"
            unzip -o /tmp/protoc.zip -d "$HOME/protoc" >/dev/null
            ls -la "$HOME/protoc/bin/" || true
            echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/protoc/bin:$PATH"
          fi
          protoc --version
          echo "/opt/homebrew/opt/openjdk@17/bin:$PATH" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/openjdk@17/bin:$PATH"
          java -version
      - name: Build porting libs
        run: make -C porting
      - name: Build scrcpy-server
        run: make -C porting scrcpy-server
      - name: Archive
        run: |
          set -euo pipefail
          mkdir -p build/archive
          xcodebuild archive -project "scrcpy-app/Scrcpy Remote.xcodeproj" -scheme "Scrcpy Remote" -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/archive/ScrcpyRemote.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ENABLE_BITCODE=NO
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          cp -R "build/archive/ScrcpyRemote.xcarchive/Products/Applications/Scrcpy Remote.app" build/ipa/Payload/
          cd build/ipa
          zip -qr ../../ScrcpyRemote-unsigned.ipa Payload
          cd ../..
          ls -lh ScrcpyRemote-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ScrcpyRemote-unsigned-ipa
          path: ScrcpyRemote-unsigned.ipa
          retention-days: 30
